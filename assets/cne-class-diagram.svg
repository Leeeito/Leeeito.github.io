<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1160" viewBox="0 0 1400 1160" role="img" aria-labelledby="title desc">
<title id="title">Custom Normal Editing Tools のクラス図</title>
<desc id="desc">Panel と5つの Operator の継承関係。UIからの操作呼び出しと、共通関数・法線計算モジュールへの依存を示す。関数とモジュールはクラスと区別して表示。</desc>
<defs>
<marker id="inherit" markerWidth="14" markerHeight="14" refX="13" refY="7" orient="auto"><path d="M1 1 L13 7 L1 13 Z" fill="#080d17" stroke="#dce6f5" stroke-width="1.5"/></marker>
<marker id="call" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#73cec5" stroke-width="1.6"/></marker>
</defs>
<style>text{font-family:'Segoe UI','Noto Sans JP','Yu Gothic',sans-serif;fill:#dce6f5;font-size:17px}.name{font-family:Consolas,'Noto Sans JP',monospace;font-size:18px;font-weight:600}.small{fill:#98abc3;font-size:15px}.line{stroke:#2a3b50;stroke-width:1}.box{fill:#101a29;stroke:#3f5570;stroke-width:1.5;rx:9}.module{fill:#102421;stroke:#40847b}.inherit{stroke:#dce6f5;stroke-width:1.6;fill:none;marker-end:url(#inherit)}.call{stroke:#73cec5;stroke-width:1.6;stroke-dasharray:7 5;fill:none;marker-end:url(#call)}</style>
<rect width="1400" height="1160" fill="#080d17"/>
<text x="30" y="34" style="font-size:22px;font-weight:700">Custom Normal Editing Tools — 実コードの構成</text>
<text x="30" y="62" class="small">クラスは6つ。共通関数・計算モジュール・Blender APIは別の要素として示しています。</text>
<path class="inherit" d="M185 218 V175 H185 V170"/><path class="inherit" d="M410 190 V174 H645 V170"/><path d="M440 243 H410 V190" stroke="#dce6f5" stroke-width="1.6" fill="none"/><path class="call" d="M350 278 H382 V282 H440"/><path d="M440 381 H410 V190" stroke="#dce6f5" stroke-width="1.6" fill="none"/><path class="call" d="M350 278 H382 V420 H440"/><path d="M440 519 H410 V190" stroke="#dce6f5" stroke-width="1.6" fill="none"/><path class="call" d="M350 278 H382 V558 H440"/><path d="M440 657 H410 V190" stroke="#dce6f5" stroke-width="1.6" fill="none"/><path class="call" d="M350 278 H382 V696 H440"/><path d="M440 795 H410 V190" stroke="#dce6f5" stroke-width="1.6" fill="none"/><path class="call" d="M350 278 H382 V834 H440"/><path class="call" d="M350 424 H397 V428 H440"/><path class="call" d="M820 260 H853 V340 H910"/><path class="call" d="M820 290 H875 V650 H910"/><path class="call" d="M820 398 H853 V340 H910"/><path class="call" d="M820 428 H875 V650 H910"/><path class="call" d="M820 536 H853 V340 H910"/><path class="call" d="M820 566 H875 V650 H910"/><path class="call" d="M820 704 H842 V938 H910"/><path class="call" d="M820 842 H842 V938 H910"/><g><rect class="box" x="20" y="105" width="330" height="64"/><text x="36" y="128" class="small">«class»</text><text x="36" y="153" class="name">bpy.types.Panel</text><path class="line" d="M20 165 H350"/></g><g><rect class="box" x="440" y="105" width="380" height="64"/><text x="456" y="128" class="small">«class»</text><text x="456" y="153" class="name">bpy.types.Operator</text><path class="line" d="M440 165 H820"/></g><g><rect class="box" x="20" y="218" width="330" height="118"/><text x="36" y="241" class="small">«class»</text><text x="36" y="266" class="name">MYNT_PT_main</text><path class="line" d="M20 278 H350"/><text x="36" y="302">+ draw(context)</text><text x="36" y="329">5つの操作ボタンを配置</text></g><g><rect class="box module" x="20" y="365" width="330" height="118"/><text x="36" y="388" class="small">«property»</text><text x="36" y="413" class="name">Scene.mynt_strength</text><path class="line" d="M20 425 H350"/><text x="36" y="449">平均化のブレンド率</text><text x="36" y="476">Panelで編集 → averageで取得</text></g><g><rect class="box" x="440" y="218" width="380" height="118"/><text x="456" y="241" class="small">«class»</text><text x="456" y="266" class="name">MYNT_OT_flatten</text><path class="line" d="M440 278 H820"/><text x="456" y="302">+ execute(context)</text><text x="456" y="329">選択面を平坦化</text></g><g><rect class="box" x="440" y="356" width="380" height="118"/><text x="456" y="379" class="small">«class»</text><text x="456" y="404" class="name">MYNT_OT_average</text><path class="line" d="M440 416 H820"/><text x="456" y="440">+ execute(context)</text><text x="456" y="467">選択面のコーナー法線を平均化</text></g><g><rect class="box" x="440" y="494" width="380" height="118"/><text x="456" y="517" class="small">«class»</text><text x="456" y="542" class="name">MYNT_OT_selected_align</text><path class="line" d="M440 554 H820"/><text x="456" y="578">+ execute(context)</text><text x="456" y="605">アクティブ面の方向に整列</text></g><g><rect class="box" x="440" y="632" width="380" height="118"/><text x="456" y="655" class="small">«class»</text><text x="456" y="680" class="name" style="font-size:16px">MYNT_OT_toggle_vertex_normals</text><path class="line" d="M440 692 H820"/><text x="456" y="716">+ execute(context)</text><text x="456" y="743">頂点法線表示を切り替え</text></g><g><rect class="box" x="440" y="770" width="380" height="118"/><text x="456" y="793" class="small">«class»</text><text x="456" y="818" class="name" style="font-size:16px">MYNT_OT_toggle_face_orientation</text><path class="line" d="M440 830 H820"/><text x="456" y="854">+ execute(context)</text><text x="456" y="881">面の向きを色で表示</text></g><g><rect class="box module" x="910" y="260" width="460" height="199"/><text x="926" y="283" class="small">«function»</text><text x="926" y="308" class="name">edit_selected_normals</text><path class="line" d="M910 320 H1370"/><text x="926" y="344">(context, modifier)</text><text x="926" y="371">選択・モードを確認 / Objectモードへ</text><text x="926" y="398">コーナー法線を読み、modifierを実行</text><text x="926" y="425">カスタム法線を設定 / 元のモードへ</text><text x="926" y="452">定義: __init__.py</text></g><g><rect class="box module" x="910" y="575" width="460" height="226"/><text x="926" y="598" class="small">«module»</text><text x="926" y="623" class="name">normal_logic.py</text><path class="line" d="M910 635 H1370"/><text x="926" y="659">+ flatten_normals(...)</text><text x="926" y="686">+ average_normals(...)</text><text x="926" y="713">+ align_to_target(...)</text><text x="926" y="740">+ blend_normals(...)</text><text x="926" y="767">mathutils.Vectorでベクトルを計算</text><text x="926" y="794">UIを持たない計算モジュール</text></g><g><rect class="box module" x="910" y="875" width="460" height="118"/><text x="926" y="898" class="small">«Blender API»</text><text x="926" y="923" class="name">context.space_data.overlay</text><path class="line" d="M910 935 H1370"/><text x="926" y="959">show_vertex_normals</text><text x="926" y="986">show_face_orientation</text></g><g>
<rect class="box" x="20" y="950" width="800" height="174"/>
<text x="40" y="980" style="font-weight:700">読み方とソース</text>
<path class="inherit" d="M45 1010 H125"/><text x="145" y="1016">継承（矢印の先が親クラス）</text>
<path class="call" d="M45 1045 H125"/><text x="145" y="1051">操作の呼び出し・参照（実装上の依存）</text>
<text x="40" y="1088" class="small">__init__.py : UI / Operator / 共通関数 / 登録処理</text>
<text x="40" y="1112" class="small">normal_logic.py : 法線計算　｜　blender_manifest.toml : 配布メタデータ</text>
</g>
<style>.name{letter-spacing:-.25px}</style>
</svg>